<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">モンテカルロ積分：関数値の平均から面積を近似する</title>
  <desc id="desc">左は区間0から1で一様に選んだ6点と関数xの二乗の値．右は同じ関数と，6個の関数値の平均を高さとする長方形．長方形の面積で定積分を近似する．</desc>
