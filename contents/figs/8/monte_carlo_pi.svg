<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">点の割合から円周率を推定する</title>
  <desc id="desc">一辺1の正方形にランダムな点を置く．原点からの距離が1以下の点は4分の1円の内部にあり，その割合は円周率を4で割った値に近づく．</desc>
