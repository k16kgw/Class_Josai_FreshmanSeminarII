<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">区分求積法による定積分の近似</title>
  <desc id="desc">増加する関数の下側を小区間に分け，各小区間の左端の関数値を高さとする長方形で面積を近似する図</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#214f7a"/>
    </marker>
    <marker id="measure-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        fill: #111827;
        letter-spacing: 0;
      }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; }
      .point { font-size: 25px; font-style: italic; }
      .axis { stroke: #214f7a; stroke-width: 4; fill: none; marker-end: url(#axis-arrow); }
      .function { stroke: #2563a6; stroke-width: 7; fill: none; stroke-linecap: round; }
      .approx { stroke: #d97706; stroke-width: 4; fill: #fff1df; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="55" class="title" text-anchor="middle">区分求積法による近似</text>

  <path d="M 90 590 H 1130" class="axis"/>
  <path d="M 120 610 V 85" class="axis"/>

  <rect x="120" y="500" width="190" height="90" class="approx"/>
  <rect x="310" y="350" width="190" height="240" class="approx"/>
  <rect x="500" y="260" width="190" height="330" class="approx"/>
  <rect x="690" y="205" width="190" height="385" class="approx"/>
  <rect x="880" y="165" width="190" height="425" class="approx"/>

  <path d="M 120 500 C 205 420, 260 375, 310 350 C 390 305, 445 275, 500 260 C 580 230, 635 215, 690 205 C 770 184, 825 172, 880 165 C 955 149, 1015 140, 1070 135" class="function"/>

  <line x1="120" y1="665" x2="310" y2="665" stroke="#d97706" stroke-width="3" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
  <text x="215" y="710" class="label" text-anchor="middle" fill="#9a4f00">小区間の幅 h</text>

  <text x="120" y="635" class="point" text-anchor="middle">x₀</text>
  <text x="310" y="635" class="point" text-anchor="middle">x₁</text>
  <text x="500" y="635" class="point" text-anchor="middle">x₂</text>
  <text x="690" y="635" class="point" text-anchor="middle">x₃</text>
  <text x="880" y="635" class="point" text-anchor="middle">x₄</text>
  <text x="1070" y="635" class="point" text-anchor="middle">x₅</text>

  <line x1="180" y1="95" x2="250" y2="95" class="function"/>
  <text x="265" y="104" class="label">関数 f(x)</text>
  <rect x="180" y="120" width="70" height="32" class="approx"/>
  <text x="265" y="146" class="label">左端の高さを使う長方形</text>
</svg>
