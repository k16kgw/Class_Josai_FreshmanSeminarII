    <text x="84" y="522.5" class="tick" text-anchor="end">-2</text>
    <line x1="100" y1="407.5" x2="1180" y2="407.5" class="grid"/>
    <text x="84" y="413.5" class="tick" text-anchor="end">0</text>
    <line x1="100" y1="298.5" x2="1180" y2="298.5" class="grid"/>
    <text x="84" y="304.5" class="tick" text-anchor="end">2</text>
    <line x1="100" y1="189.5" x2="1180" y2="189.5" class="grid"/>
