    <text x="441.0526315789474" y="710" class="tick" text-anchor="middle">-1</text>
    <line x1="725.2631578947369" y1="135" x2="725.2631578947369" y2="680" class="grid"/>
    <text x="725.2631578947369" y="710" class="tick" text-anchor="middle">0</text>
