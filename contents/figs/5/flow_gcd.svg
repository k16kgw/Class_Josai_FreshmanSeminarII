<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc">
  <title id="title">ユークリッドの互除法の手続き</title>
  <desc id="desc">JIS X 0121に準拠したフローチャート．判断記号の「はい」は下，「いいえ」は右へ進む．</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <g class="edge"><polyline points="300,72 300,100" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="300,164 300,204" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="300,276 300,320" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="300,424 300,480" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="316" y="462" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="430,372 490,372" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="437" y="362" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="300,544 300,580" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="300,644 300,680" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="620,420 620,750 50,750 50,240 130,240" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="node"><rect x="210" y="20" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="52">開始</tspan></text></g>
  <g class="node"><polygon points="162,100 460,100 438,164 140,164" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="138">二つの正の整数を受け取る</tspan></text></g>
  <g class="node"><rect x="130" y="204" width="340" height="72" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="234.5">一方の整数を</tspan><tspan x="300" y="257.5">もう一方の整数で割る</tspan></text></g>
  <g class="node"><polygon points="300,320 430,372 300,424 170,372" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="378">余りは0か</tspan></text></g>
  <g class="node"><rect x="150" y="480" width="300" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="518">割る数を最大公約数とする</tspan></text></g>
  <g class="node"><polygon points="162,580 460,580 438,644 140,644" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="618">最大公約数を結果として出す</tspan></text></g>
  <g class="node"><rect x="210" y="680" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="300" y="712">終了</tspan></text></g>
  <g class="node"><rect x="490" y="324" width="260" height="96" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="620" y="355">直前の割る数を</tspan><tspan x="620" y="378">割られる数にし</tspan><tspan x="620" y="401">余りを新しい割る数にする</tspan></text></g>
</svg>
