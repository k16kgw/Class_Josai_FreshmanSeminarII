<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" role="img" aria-labelledby="title desc">
  <title id="title">素因数分解の手続き</title>
  <desc id="desc">JIS X 0121に準拠したフローチャート．判断記号の「はい」は下，「いいえ」は右へ進む．</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <g class="edge"><polyline points="380,72 380,100" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,164 380,196" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,260 380,300" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,410 380,474" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="396" y="456" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="530,355 670,355" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="558" y="352" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="810,407 810,460" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="826" y="442" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="950,355 1060,355 1060,590" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="970" y="342" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="810,532 810,626 910,626" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="1060,662 1060,702" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,538 380,578" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,682 380,742" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="396" y="724" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="520,630 620,630" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="548" y="620" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="380,818 380,940 110,940 110,506 220,506" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="760,662 760,1020 80,1020 80,228 220,228" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="node"><rect x="290" y="20" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="52">開始</tspan></text></g>
  <g class="node"><polygon points="227,100 555,100 533,164 205,164" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="138">素因数分解する整数を受け取る</tspan></text></g>
  <g class="node"><rect x="220" y="196" width="320" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="234">2から順番に割る数を選ぶ</tspan></text></g>
  <g class="node"><polygon points="380,300 530,355 380,410 230,355" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="349.5">割る数の2乗は</tspan><tspan x="380" y="372.5">残りの整数以下か</tspan></text></g>
  <g class="node"><polygon points="810,303 950,355 810,407 670,355" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="810" y="349.5">1より大きい整数が</tspan><tspan x="810" y="372.5">残っているか</tspan></text></g>
  <g class="node"><rect x="640" y="460" width="340" height="72" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="810" y="490.5">残った整数を</tspan><tspan x="810" y="513.5">最後の素因数として記録する</tspan></text></g>
  <g class="node"><polygon points="932,590 1210,590 1188,662 910,662" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="1060" y="620.5">記録した素因数を</tspan><tspan x="1060" y="643.5">結果として出す</tspan></text></g>
  <g class="node"><rect x="970" y="702" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="1060" y="734">終了</tspan></text></g>
  <g class="node"><rect x="220" y="474" width="320" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="512">現在の割る数で割り算を試す</tspan></text></g>
  <g class="node"><polygon points="380,578 520,630 380,682 240,630" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="636">余りは0か</tspan></text></g>
  <g class="node"><rect x="200" y="742" width="360" height="76" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="774.5">割った数を素因数として記録し</tspan><tspan x="380" y="797.5">商を新しい残りの整数とする</tspan></text></g>
  <g class="node"><rect x="620" y="598" width="280" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="760" y="636">次の割る数へ進む</tspan></text></g>
</svg>
