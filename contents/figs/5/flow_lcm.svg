<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
  <title id="title">最小公倍数を求める手続き</title>
  <desc id="desc">JIS X 0121に準拠したフローチャート．判断記号の「はい」は下，「いいえ」は右へ進む．</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <g class="edge"><polyline points="380,72 380,100" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,164 380,200" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,264 380,300" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,372 380,410" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,482 380,520" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,584 380,610" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="node"><rect x="290" y="20" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="52">開始</tspan></text></g>
  <g class="node"><polygon points="242,100 540,100 518,164 220,164" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="138">二つの正の整数を受け取る</tspan></text></g>
  <g class="node"><rect x="230" y="200" width="300" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="238">二つの整数の積を求める</tspan></text></g>
  <g class="node"><rect x="210" y="300" width="340" height="72" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="330.5">二つの整数の</tspan><tspan x="380" y="353.5">最大公約数を求める</tspan></text></g>
  <g class="node"><rect x="200" y="410" width="360" height="72" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="440.5">積を最大公約数で割り</tspan><tspan x="380" y="463.5">最小公倍数を求める</tspan></text></g>
  <g class="node"><polygon points="232,520 550,520 528,584 210,584" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="558">最小公倍数を結果として出す</tspan></text></g>
  <g class="node"><rect x="290" y="610" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="642">終了</tspan></text></g>
</svg>
