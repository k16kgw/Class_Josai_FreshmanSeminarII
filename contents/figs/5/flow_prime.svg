<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1080" viewBox="0 0 1060 1080" role="img" aria-labelledby="title desc">
  <title id="title">素数を判定する手続き</title>
  <desc id="desc">JIS X 0121に準拠したフローチャート．判断記号の「はい」は下，「いいえ」は右へ進む．</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <g class="edge"><polyline points="380,72 380,100" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,164 380,200" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,304 380,356" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="396" y="342" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="520,252 640,252" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="548" y="242" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="800,284 800,318" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,428 380,460" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,570 380,630" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="396" y="612" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="530,515 640,515" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="558" y="502" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="800,547 800,581" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="380,734 380,790" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="396" y="772" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">はい</text></g>
  <g class="edge"><polyline points="520,682 630,682" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/><text class="edge-label" x="548" y="672" fill="#111" font-family="sans-serif" font-size="17" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">いいえ</text></g>
  <g class="edge"><polyline points="380,854 380,892" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="edge"><polyline points="760,714 760,1010 120,1010 120,392 160,392" style="fill:none;stroke:#263238;stroke-width:2px;stroke-linejoin:miter" marker-end="url(#arrow)"/></g>
  <g class="node"><rect x="290" y="20" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="52">開始</tspan></text></g>
  <g class="node"><polygon points="242,100 540,100 518,164 220,164" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="138">対象の整数を受け取る</tspan></text></g>
  <g class="node"><polygon points="380,200 520,252 380,304 240,252" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="246.5">対象の整数は</tspan><tspan x="380" y="269.5">2以上か</tspan></text></g>
  <g class="node"><polygon points="662,220 960,220 938,284 640,284" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="800" y="246.5">素数ではないという</tspan><tspan x="800" y="269.5">結果を出す</tspan></text></g>
  <g class="node"><rect x="710" y="318" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="800" y="350">終了</tspan></text></g>
  <g class="node"><rect x="160" y="356" width="440" height="72" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="386.5">2以上，対象の整数未満の整数から</tspan><tspan x="380" y="409.5">次の数を割る数として取り出す</tspan></text></g>
  <g class="node"><polygon points="380,460 530,515 380,570 230,515" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="509.5">次の割る数を</tspan><tspan x="380" y="532.5">取り出せたか</tspan></text></g>
  <g class="node"><polygon points="662,483 960,483 938,547 640,547" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="800" y="509.5">素数であるという</tspan><tspan x="800" y="532.5">結果を出す</tspan></text></g>
  <g class="node"><rect x="710" y="581" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="800" y="613">終了</tspan></text></g>
  <g class="node"><polygon points="380,630 520,682 380,734 240,682" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="676.5">対象の整数を</tspan><tspan x="380" y="699.5">余りなく割り切れるか</tspan></text></g>
  <g class="node"><polygon points="242,790 540,790 518,854 220,854" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="816.5">素数ではないという</tspan><tspan x="380" y="839.5">結果を出す</tspan></text></g>
  <g class="node"><rect x="290" y="892" width="180" height="52" rx="26" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="380" y="924">終了</tspan></text></g>
  <g class="node"><rect x="630" y="650" width="260" height="64" style="fill:#fff;stroke:#263238;stroke-width:2px"/><text text-anchor="middle" fill="#111" font-family="sans-serif" font-size="17"><tspan x="760" y="688">次の割る数へ進む</tspan></text></g>
</svg>
